name: Release Bump

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Enter the marketing version (e.g., 7.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-and-release:
    environment: production
    runs-on: macos-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate marketing version
        id: version
        run: |
          MARKETING_VERSION="$(echo "${{ inputs.marketing_version }}" | xargs)"

          if ! echo "$MARKETING_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Invalid marketing_version '$MARKETING_VERSION'. Expected format like 7.0.2"
            exit 1
          fi

          echo "Marketing Version: $MARKETING_VERSION"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update marketing version
        run: |
          xcrun agvtool new-marketing-version "${{ steps.version.outputs.marketing_version }}"

      - name: Commit marketing version to master if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Marketing version is already ${{ steps.version.outputs.marketing_version }}, skipping commit"
          else
            git add -u
            git commit -m "Bump marketing version to ${{ steps.version.outputs.marketing_version }}"
            git push origin master
          fi

      - name: Merge master into production and push
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git checkout -B production origin/production
            git merge master --no-edit -X theirs
          else
            git checkout -b production master
          fi

          git push origin production